name: Build F-Droid references 351 and 352

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference-352:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        with:
          # This checkout supplies the current 2.3.15 F-Droid recipe without
          # the minification setting that broke notifications in the 352 APK.
          ref: b50961b68e76f001b8c31cf317f90f93795af298
          fetch-depth: 1

      - name: Fetch the F-Droid buildserver tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --quiet \
            https://gitlab.com/fdroid/fdroidserver.git fdroidserver

      - name: Prepare F-Droid metadata workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fdroiddata/metadata fdroiddata/srclibs
          cp packaging/fdroid/com.willian.willdo.yml \
            fdroiddata/metadata/com.willian.willdo.yml
          cat > fdroiddata/srclibs/firebase-stub.yml <<'EOF'
          RepoType: git
          Repo: https://gitlab.com/freed-by-fdroid/firebase-stubs.git
          EOF
          # This temporary build must generate the 352 artifact first. The
          # public metadata keeps Binaries and is not changed by this job.
          sed -i '/^Binaries:/d' fdroiddata/metadata/com.willian.willdo.yml
          git init --quiet fdroiddata
          git -C fdroiddata config user.name 'Faz agora! F-Droid build'
          git -C fdroiddata config user.email 'adm@whats.men'
          cp fdroidserver/examples/config.yml fdroiddata/config.yml
          git -C fdroiddata add config.yml metadata/com.willian.willdo.yml \
            srclibs/firebase-stub.yml
          git -C fdroiddata commit --quiet -m 'Temporary F-Droid reference build'

      - name: Build versionCodes 351 and 352 in the F-Droid buildserver
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+rwX fdroiddata
          build_one() {
            local vercode="$1"
            docker run --rm -u vagrant --entrypoint /bin/bash \
              -v "$GITHUB_WORKSPACE/fdroiddata:/build" \
              -v "$GITHUB_WORKSPACE/fdroidserver:/home/vagrant/fdroidserver" \
              registry.gitlab.com/fdroid/fdroidserver:buildserver \
              -lc '. /etc/profile; export PATH="$fdroidserver:$PATH" PYTHONPATH="$fdroidserver:$fdroidserver/examples"; git config --global --add safe.directory /build; git config --global --add safe.directory /home/vagrant/fdroidserver; cd /build; fdroid readmeta; fdroid fetchsrclibs --verbose com.willian.willdo:'"$vercode"'; fdroid build --on-server --no-tarball com.willian.willdo:'"$vercode"' --verbose'
          }
          build_one 351
          build_one 352

      - name: Upload unsigned reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: faz-agora-v2.3.15-351-352-unsigned
          if-no-files-found: error
          path: |
            fdroiddata/unsigned/com.willian.willdo_351.apk
            fdroiddata/unsigned/com.willian.willdo_352.apk
