name: Build F-Droid references 351 and 352

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-reference-352:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out the release source
        uses: actions/checkout@v4
        # Use the workflow's commit for the current metadata mirror. The recipe
        # itself still pins the app source commit in its Build entries.

      - name: Fetch the F-Droid buildserver tools
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 --quiet \
            https://gitlab.com/fdroid/fdroidserver.git fdroidserver

      - name: Prepare F-Droid metadata workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p fdroiddata/metadata fdroiddata/srclibs fdroiddata/build fdroiddata/tmp
          cp packaging/fdroid/com.willian.willdo.yml \
            fdroiddata/metadata/com.willian.willdo.yml
          cat > fdroiddata/srclibs/firebase-stub.yml <<'EOF'
          RepoType: git
          Repo: https://gitlab.com/freed-by-fdroid/firebase-stubs.git
          EOF
          # This temporary build must generate the 352 artifact first. The
          # public metadata keeps Binaries and is not changed by this job.
          sed -i '/^Binaries:/d' fdroiddata/metadata/com.willian.willdo.yml
          git init --quiet fdroiddata
          git -C fdroiddata config user.name 'Faz agora! F-Droid build'
          git -C fdroiddata config user.email 'adm@whats.men'
          cp fdroidserver/examples/config.yml fdroiddata/config.yml
          git -C fdroiddata add config.yml metadata/com.willian.willdo.yml \
            srclibs/firebase-stub.yml
          git -C fdroiddata commit --quiet -m 'Temporary F-Droid reference build'

      - name: Build versionCodes 351 and 352 in the F-Droid CI build path
        shell: bash
        run: |
          set -euo pipefail
          chmod -R a+rwX fdroiddata
          build_one() {
            local vercode="$1"
            # F-Droid's CI runs the build from /home/vagrant, with sources in
            # /home/vagrant/build/<appid>. Native ELF build IDs include build
            # paths, so building from /build produces different APK bytes even
            # when the compiled code is otherwise identical.
            docker run --rm -u vagrant --entrypoint /bin/bash \
              -v "$GITHUB_WORKSPACE/fdroiddata:/builds/fdroid/fdroiddata" \
              -v "$GITHUB_WORKSPACE/fdroidserver:/home/vagrant/fdroidserver" \
              -v "$GITHUB_WORKSPACE/fdroiddata/tmp:/home/vagrant/tmp" \
              registry.gitlab.com/fdroid/fdroidserver:buildserver-trixie \
              -lc '
                set -euo pipefail
                . /etc/profile.d/bsenv.sh
                export PATH="$fdroidserver:$PATH"
                export PYTHONPATH="$fdroidserver:$fdroidserver/examples"
                export PYTHONUNBUFFERED=true HOME=/home/vagrant
                export GRADLE_USER_HOME=/home/vagrant/.gradle ANDROID_HOME=/opt/android-sdk
                git config --global --add safe.directory /builds/fdroid/fdroiddata
                git config --global --add safe.directory /home/vagrant/fdroidserver
                mkdir -p /home/vagrant/build /home/vagrant/metadata
                cp -R /builds/fdroid/fdroiddata/build/. /home/vagrant/build/
                cp /builds/fdroid/fdroiddata/metadata/com.willian.willdo.yml /home/vagrant/metadata/
                ln -s /builds/fdroid/fdroiddata /home/vagrant/fdroiddata
                ln -s /builds/fdroid/fdroiddata/srclibs /home/vagrant/srclibs
                cd /home/vagrant
                fdroid fetchsrclibs --verbose "com.willian.willdo:$1"
                rm /home/vagrant/fdroiddata
                unset CI
                fdroid build --verbose --test --refresh-scanner --on-server --no-tarball "com.willian.willdo:$1"
              ' _ "$vercode"
          }
          build_one 351
          build_one 352

      - name: Upload unsigned reference artifact
        uses: actions/upload-artifact@v4
        with:
          name: faz-agora-v2.3.15-351-352-unsigned
          if-no-files-found: error
          path: |
            fdroiddata/tmp/com.willian.willdo_351.apk
            fdroiddata/tmp/com.willian.willdo_352.apk
