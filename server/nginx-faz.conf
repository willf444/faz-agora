limit_req_zone $binary_remote_addr zone=faz_pix_limit:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name faz.whats.men;

    client_max_body_size 16k;

    location = /apoie {
        alias /var/www/faz-apoie/index.html;
        default_type text/html;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=faz_pix_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
